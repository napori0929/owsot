<script>
/* ===== 기존 코드 유지 ===== */
const statusEl = document.getElementById("status");

// ✅ 탭 전환 유지
const tabs = document.querySelectorAll('.tab-btn');
const contents = document.querySelectorAll('.tab-content');
tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    contents.forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

async function uploadLogo(fileInput){
  try {
    if(!fileInput || !fileInput.files?.length) return "";
    const fd = new FormData();
    fd.append("logo", fileInput.files[0]);
    const res = await fetch("http://localhost:3000/upload-logo",{method:"POST",body:fd});
    if(!res.ok) throw new Error("Upload failed");
    const data = await res.json();
    return data.filePath ?? "";
  }catch(err){
    console.warn("⚠️ Upload Error:", err);
    return "";
  }
}

  const mapModes = {
    escort: ["도라도","66번 국도","감시기지 지브롤터","리알토","하바나","쓰레기촌","서킷 로얄","샴발리 수도원"],
    hybrid: ["할리우드","아이헨발데","왕의 길","블리자드 월드","눔바니","미드타운","파라이수"],
    control: ["일리오스","리장 타워","네팔","오아시스","부산","남극 반도","사모아"],
    push: ["콜로세오","뉴 퀸 스트리트","이스페란사","루나사피"],
    flashpoint: ["수라바사","뉴 정크 시티","아틀리스"]
  };
  
async function onUpdate() {
  const btn = document.getElementById("updateBtn");
  btn.disabled = true;
  const statusEl = document.getElementById("status");
  statusEl.textContent = "Updating...";
  try {
    // ✅ 파일 업로드 (로고 + 게임로고)
    const [t1logo, t2logo, glogo] = await Promise.all([
      uploadLogo(document.getElementById("team1logoFile")),
      uploadLogo(document.getElementById("team2logoFile")),
      uploadLogo(document.getElementById("gameLogoFile")),
    ]);

    const body = {
      hudType: document.getElementById("hudType")?.value ?? "normal",
      descriptions: document.getElementById("descriptions")?.value ?? "",
      mapName: document.getElementById("mapName")?.value ?? "",
      initialBan: document.getElementById("initialBan")?.value ?? "",
      overviewImage: (document.getElementById("overviewImageSelect")?.value || "").trim(),
      ...(glogo ? { gameLogo: glogo } : {}),

      team1: {
        name: document.getElementById("team1name")?.value ?? "",
        fullName: document.getElementById("team1full")?.value ?? "",   // ✅ 빈값 확실히 반영
        score: +(document.getElementById("team1score")?.value ?? 0),
        ban: document.getElementById("team1ban")?.value || "",
        color: document.getElementById("team1color")?.value ?? "#06F5F5",
        logo: t1logo && t1logo.trim() !== "" ? t1logo : (document.getElementById("team1logoPath")?.value || ""),
        side: document.getElementById("team1side")?.value ?? "none",
      },
      team2: {
        name: document.getElementById("team2name")?.value ?? "",
        fullName: document.getElementById("team2full")?.value ?? "",   // ✅ 빈값 확실히 반영
        score: +(document.getElementById("team2score")?.value ?? 0),
        ban: document.getElementById("team2ban")?.value || "",
        color: document.getElementById("team2color")?.value ?? "#E42D50",
        logo: t2logo && t2logo.trim() !== "" ? t2logo : (document.getElementById("team2logoPath")?.value || ""),
        side: document.getElementById("team2side")?.value ?? "none",
      },



      mapNumber: +mapNum.value || 1,
      firstTo: +firstTo.value || 3,
      // ✅ mapPickResults는 Map Pick Results 입력값 기준
      mapPickResults:
        (document.getElementById("mapPickResults")?.value.trim()
          ? document.getElementById("mapPickResults").value.split(",").map(x => x.trim()).filter(Boolean)
          : []),

      // ✅ setResults는 Set Results 입력값 기준
      setResults:
        (document.getElementById("setResults")?.value.trim()
          ? document.getElementById("setResults").value.split(",").map(x => x.trim()).filter(Boolean)
          : []),



      details: {
        escort: [...document.querySelectorAll("#escort input:checked")].map(i => i.parentNode.textContent.trim()),
        hybrid: [...document.querySelectorAll("#hybrid input:checked")].map(i => i.parentNode.textContent.trim()),
        control: [...document.querySelectorAll("#control input:checked")].map(i => i.parentNode.textContent.trim()),
        push: [...document.querySelectorAll("#push input:checked")].map(i => i.parentNode.textContent.trim()),
        flashpoint: [...document.querySelectorAll("#flashpoint input:checked")].map(i => i.parentNode.textContent.trim())
      }


    };
    // ✅ 6~8명 전원 로스터(동적 로스터 화면에서 사용)
    // NOTE: 기존 5슬롯(tank/dps1/dps2/sup1/sup2) 구조는 제거됨
    body.team1.rosterPlayers = selectedTeams?.team1?.rosterPlayers || [];
    body.team2.rosterPlayers = selectedTeams?.team2?.rosterPlayers || [];




    const res = await fetch("http://localhost:3000/update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error("Server rejected");
    statusEl.textContent = "✅ Updated Successfully";
    console.log("📤 HUD Updated:", body);
  } catch (err) {
    console.error("❌ Update failed:", err);
    statusEl.textContent = "❌ Failed to update";
  } finally {
    btn.disabled = false;
  }
}

async function fetchTabs() {

  return await res.json();
}

async function fetchSheet(tabName) {
  const res = await fetch(`http://localhost:3000/excel-sheet?name=${encodeURIComponent(tabName)}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`Failed to fetch sheet: ${tabName}`);
  return await res.json();
}

async function loadAllTeams() {
  const statusEl = document.getElementById("status");

  try {
    sheetTabs = await fetchTabs();
  } catch (e) {
    console.warn("⚠️ excel tab load failed:", e);
    sheetTabs = [];
  }

  const results = {};
  await Promise.all(
    sheetTabs.map(async (tab) => {
      try {
        results[tab] = await fetchSheet(tab);
      } catch (e) {
        console.warn("⚠️ excel sheet fetch failed:", tab, e);
        results[tab] = [];
      }
    })
  );
  allTeams = results;

  const area = document.getElementById("sheetLoadArea");
  if (!area) {
    console.error("❌ #sheetLoadArea 가 없습니다.");
    return;
  }

  document.getElementById("applyTeamsBtn").addEventListener("click", () => {
    const t1 = document.getElementById("selectTeam1").value;
    const t2 = document.getElementById("selectTeam2").value;

    const clampRoster = (roster, teamName) => {
      const r = Array.isArray(roster) ? roster.filter(p => (p?.name || "").trim() !== "") : [];
      const trimmed = r.slice(0, 8);
      if (trimmed.length < 6 && statusEl) {
        statusEl.textContent = `⚠️ ${teamName} 로스터가 ${trimmed.length}명입니다. 최소 6명 필요 (Excel 확인)`;
      }
      if (r.length > 8 && statusEl) {
        statusEl.textContent = `ℹ️ ${teamName} 로스터가 ${r.length}명이라 상위 8명만 사용합니다.`;
      }
      return trimmed;
    };

    const roster1 = clampRoster(buildRosterList(allTeams[t1] || []), t1);
    const roster2 = clampRoster(buildRosterList(allTeams[t2] || []), t2);

    selectedTeams = {
      team1: { name: t1, rosterPlayers: roster1 },
      team2: { name: t2, rosterPlayers: roster2 }
    };

    // HUD 이름에도 반영
    const t1name = document.getElementById("team1name");
    const t2name = document.getElementById("team2name");
    if (t1name) t1name.value = t1;
    if (t2name) t2name.value = t2;

    if (statusEl) statusEl.textContent = `✅ Loaded rosters: ${t1} (${roster1.length}) vs ${t2} (${roster2.length})`;
    console.log("✅ Loaded from Excel:", selectedTeams);
  });

  if (statusEl) statusEl.textContent = "✅ Excel sheets loaded";
}

  }));

function applyDerivedResultsFromMapSets(mapSets) {
  const team1Name = document.getElementById("team1name")?.value?.trim() || "";
  const team2Name = document.getElementById("team2name")?.value?.trim() || "";

  const derivedSetResults = [];
  const derivedMapPickResults = [];

  for (const s of (mapSets || [])) {
    if (s.map && s.map.trim()) {
      derivedMapPickResults.push(s.map.trim());
    }

    if (s.winner === "team1" && team1Name) {
      derivedSetResults.push(team1Name);
    } else if (s.winner === "team2" && team2Name) {
      derivedSetResults.push(team2Name);
    } else if (s.winner === "무승부") {
      derivedSetResults.push("무승부");
    }
    // 그 외(미선택)는 setResults에 추가하지 않음
  }

  document.getElementById("setResults").value =
    derivedSetResults.join(", ");
  document.getElementById("mapPickResults").value =
    derivedMapPickResults.join(", ");

  applyScoresFromSetResults(); // ✅ setResults 값을 코드로 바꾼 직후 점수 재계산

}

function applyMapNumFromSetResults() {
  const raw = document.getElementById("setResults")?.value || "";

  const tokens = raw
    .split(/[,\n]/)
    .map(s => s.trim())
    .filter(Boolean);

  const mapNumEl = document.getElementById("mapNum");
  if (!mapNumEl) return;

  // 완료된 세트 수 + 1 = 현재/다음 맵 번호
  const nextMapNum = Math.max(1, tokens.length + 1);
  mapNumEl.value = nextMapNum;
}



function computeScoresFromSetResults() {
  const team1Name = document.getElementById("team1name")?.value?.trim() || "";
  const team2Name = document.getElementById("team2name")?.value?.trim() || "";

  const raw = document.getElementById("setResults")?.value || "";

  // "A, B, 무승부" / "A\nB\ndraw" 둘 다 처리
  const tokens = raw
    .split(/[,\n]/)
    .map(s => s.trim())
    .filter(Boolean);

  let team1Wins = 0;
  let team2Wins = 0;
  let draws = 0;

  for (const t of tokens) {
    if (t === "무승부" || t.toLowerCase() === "무승부") draws++;
    else if (team1Name && t === team1Name) team1Wins++;
    else if (team2Name && t === team2Name) team2Wins++;
    // 그 외 문자열은 무시 (오타/다른 값)
  }

  return { team1Wins, team2Wins, draws, totalCounted: tokens.length };
}

function applyScoresFromSetResults() {
  const { team1Wins, team2Wins } = computeScoresFromSetResults();

  const t1 = document.getElementById("team1score");
  const t2 = document.getElementById("team2score");

  if (t1) t1.value = team1Wins;
  if (t2) t2.value = team2Wins;

  applyMapNumFromSetResults();
}

/* ===== TEAM SELECT (AUTO-FILL TEAM META) =====
   - 목적: 팀을 선택하면 team name/full name/score/color/logoPath 자동 입력
   - 로고 파일(input type=file)은 보안상 JS로 값 주입 불가 → logoPath 텍스트로 경로를 관리
   - 서버에서 팀 목록 제공 가능하면 /teams 엔드포인트를 우선 사용하고, 실패 시 하드코딩 목록 사용
*/

const DEFAULT_TEAM_CATALOG = [

  // 예시 (원하는 팀으로 여기만 채우면 됨)
  // { id: "bronze1", name: "브론즈(1팀)", fullName: "브론즈 1팀", color: "#06F5F5", logoPath: "/logos/bronze1.png", score: },
  // { id: "bronze2", name: "브론즈(2팀)", fullName: "브론즈 2팀", color: "#E42D50", logoPath: "/logos/bronze2.png"},
];

let TEAM_CATALOG = [];
let TEAM_BY_ID = {};

function buildTeamIndex(list){
  TEAM_BY_ID = {};
  (list || []).forEach(t => {
    if (!t) return;
    const id = (t.id ?? t.name ?? "").toString();
    if (!id) return;
    TEAM_BY_ID[id] = {
      id,
      name: (t.name ?? "").toString(),
      fullName: (t.fullName ?? t.full_name ?? "").toString(),
      color: (t.color ?? "").toString(),
      logoPath: (t.logoPath ?? t.logo ?? t.logo_path ?? "").toString(),
      score: Number.isFinite(+t.score)
    };
  });
}

async function loadTeamCatalog(){
  // 1) ✅ 엑셀 팀 카탈로그 우선
  try {
    const res = await fetch("http://localhost:3000/excel-team-catalog", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      const list = data?.teams || [];
      if (Array.isArray(list) && list.length) {
        TEAM_CATALOG = list;
        buildTeamIndex(TEAM_CATALOG);
        console.log("✅ Loaded TEAM_CATALOG from /excel-team-catalog:", TEAM_CATALOG.length);
        return;
      }
    }
  } catch (e) {
    console.warn("⚠️ /excel-team-catalog failed:", e);
  }

  // 2) (기존) 서버 제공(선택)
  try {
    const res = await fetch("http://localhost:3000/teams", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.teams || []);
      if (Array.isArray(list) && list.length) {
        TEAM_CATALOG = list;
        buildTeamIndex(TEAM_CATALOG);
        console.log("✅ Loaded TEAM_CATALOG from /teams:", TEAM_CATALOG.length);
        return;
      }
    }
  } catch (e) {
    console.warn("⚠️ /teams failed:", e);
  }

  // 3) fallback 하드코딩
  TEAM_CATALOG = DEFAULT_TEAM_CATALOG;
  buildTeamIndex(TEAM_CATALOG);
  console.log("ℹ️ Using DEFAULT_TEAM_CATALOG:", TEAM_CATALOG.length);
}


function fillTeamSelect(selectEl){
  if (!selectEl) return;
  const current = selectEl.value;
  selectEl.innerHTML = `<option value="">(선택)</option>` +
    Object.values(TEAM_BY_ID).map(t => {
      const label = t.name || t.id;
      return `<option value="${t.id}">${label}</option>`;
    }).join("");
  if (current && TEAM_BY_ID[current]) selectEl.value = current;
}

function applyTeamToUI(teamNum, teamId){
  const t = TEAM_BY_ID[teamId];
  if (!t) return;

  const nameEl = document.getElementById(`team${teamNum}name`);
  const fullEl = document.getElementById(`team${teamNum}full`);
  const scoreEl = document.getElementById(`team${teamNum}score`);
  const colorEl = document.getElementById(`team${teamNum}color`);
  const hexEl = document.getElementById(`team${teamNum}hex`);
  const logoPathEl = document.getElementById(`team${teamNum}logoPath`);
  const logoFileEl = document.getElementById(`team${teamNum}logoFile`);

  if (nameEl) nameEl.value = t.name || "";
  if (fullEl) fullEl.value = t.fullName || "";

  if (t.color) {
    if (colorEl) colorEl.value = t.color;
    if (hexEl) hexEl.value = t.color.toUpperCase();
  }

  if (logoPathEl) logoPathEl.value = t.logoPath || "";
  // 선택 바뀌면 업로드 파일은 무조건 비워두는 게 안전
  if (logoFileEl) logoFileEl.value = "";
}

function wireTeamAutoFill(){
  const sel1 = document.getElementById("team1Select");
  const sel2 = document.getElementById("team2Select");
  if (!sel1 || !sel2) return;

  fillTeamSelect(sel1);
  fillTeamSelect(sel2);

  sel1.addEventListener("change", () => {
    if (!sel1.value) return;
    applyTeamToUI(1, sel1.value);
    statusEl.textContent = `✅ Team 1 loaded: ${TEAM_BY_ID[sel1.value]?.name || sel1.value}`;
  });

  sel2.addEventListener("change", () => {
    if (!sel2.value) return;
    applyTeamToUI(2, sel2.value);
    statusEl.textContent = `✅ Team 2 loaded: ${TEAM_BY_ID[sel2.value]?.name || sel2.value}`;
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  await loadTeamCatalog();
  wireTeamAutoFill();
});

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("setResults")?.addEventListener("input", applyScoresFromSetResults);
  document.getElementById("team1name")?.addEventListener("input", applyScoresFromSetResults);
  document.getElementById("team2name")?.addEventListener("input", applyScoresFromSetResults);
});
